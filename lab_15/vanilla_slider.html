<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Slider</title>
    <link rel="stylesheet" href="vanilla_style.css">
</head>
<body>

    <div class="slider">
        <div class="slider-track">
            <div class="slide"><img src="images/car1.jpg" alt=""></div>
            <div class="slide"><img src="images/car2.jpg" alt=""></div>
            <div class="slide"><img src="images/car3.jpg" alt=""></div>
            <div class="slide"><img src="images/car4.jpg" alt=""></div>
        </div>
        <button class="btn prev">‹</button>
        <button class="btn next">›</button>
    </div>

    <script src="vanilla_script.js"></script>
</body>
</html>
