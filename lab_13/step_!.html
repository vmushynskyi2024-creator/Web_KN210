# index.html

```html
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моя фотогалерея</title>

    <script>
        var photosCount = 4;
        var currentPhotoIndex = 1;

        function showNextPhoto() {
            currentPhotoIndex++;

            if(currentPhotoIndex > photosCount) currentPhotoIndex = 1;

            var elem = document.getElementById("currentPhoto");
            elem.src = "images/photo" + currentPhotoIndex + ".jpg";
        }

        function addNextPhoto() {
            var newImage = document.createElement("img");

            currentPhotoIndex++;

            if(currentPhotoIndex > photosCount) currentPhotoIndex = 1;

            newImage.src = "images/photo" + currentPhotoIndex + ".jpg";
            newImage.width = 250;

            var containerElem = document.getElementById("gallery");
            containerElem.appendChild(newImage);
        }
    </script>

    <style>
        body {
            background: #c7d8f5;
            text-align: center;
            font-family: Arial;
        }

        img {
            margin: 10px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Моя фотогалерея</h1>

    <div id="gallery">
        <img id="currentPhoto" src="images/photo1.jpg" width="300">
    </div>

    <button onclick="showNextPhoto()">Наступне фото</button>
    <button onclick="addNextPhoto()">Додати фото</button>
</body>
</html>
```
