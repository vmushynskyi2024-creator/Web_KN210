<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Лабораторна робота - Flexbox</title>
<style>
nav {
  display: flex;
  background-color: #333;
  padding: 10px;
  justify-content: space-around;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 8px 16px;
}

nav a:hover {
  background-color: #ddd;
  color: black;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

.photo {
  background-color: #ccc;
  height: 100px;
  flex: 1 1 150px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo:hover {
  background-color: #999;
  transform: scale(1.05);
}

.center-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f4f4f4;
}

.center-box {
  background-color: white;
  padding: 30px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.center-box p {
  display: inline-block;
}

.center-box p:hover {
  transform: scale(1.5);
}

.card {
  display: flex;
  gap: 20px;
  border: 1px solid #aaa;
  padding: 15px;
  margin-bottom: 20px;
  background-color: #fff;
}

.card2 {
  background-color: #e6f7ff;
  border: 2px dashed #007bff;
}

@media (max-width: 600px) {
  .card {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
}
</style>
</head>
<body>

<nav>
  <a href="#">Головна</a>
  <a href="#">Про нас</a>
  <a href="#">Послуги</a>
  <a href="#">Контакти</a>
</nav>

<div class="gallery">
  <div class="photo">Фото 1</div>
  <div class="photo">Фото 2</div>
  <div class="photo">Фото 3</div>
  <div class="photo">Фото 4</div>
  <div class="photo">Фото 5</div>
  <div class="photo">Фото 6</div>
</div>

<div class="center-container">
  <div class="center-box">
    <p>Якийсь текст</p>
  </div>
</div>

<div class="card">
  <img src="https://via.placeholder.com/150" alt="Товар 1">
  <div class="card-content">
    <h2>Назва першого товару</h2>
    <p>Опис першого товару. Звичайна біла картка зі стандартною рамкою.</p>
  </div>
</div>

<div class="card card2">
  <img src="https://via.placeholder.com/150" alt="Товар 2">
  <div class="card-content">
    <h2>Назва другого товару</h2>
    <p>Опис другого товару. Ця картка має інший колір фону та пунктирну рамку.</p>
  </div>
</div>

</body>
</html>
